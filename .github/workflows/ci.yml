name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # conftest creates and drops its own habitflow_test database on this server.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements.txt pytest==9.1.1 pyyaml==6.0.2
      - run: pytest -q

  llm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  e2e:
    # Real bot handlers -> real API -> Postgres, with Telegram and the LLM faked.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install -r ../api/requirements.txt -r ../bot/requirements.txt pytest==9.1.1
      - run: pytest -q

  allinone:
    # The single image: build it, run it with its built-in database, draft a log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f allinone/Dockerfile -t habitflow-all .
      - name: Run with the built-in database
        run: |
          printf 'TELEGRAM_BOT_TOKEN=1:ci\nTELEGRAM_ALLOWED_USER_ID=1\nGROQ_API_KEY=ci\nGROQ_BASE_URL=http://127.0.0.1:9/v1\n' > ci.env
          docker run -d --name hf -v hf-data:/data --env-file ci.env habitflow-all
          for i in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' hf)" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' hf | grep -q healthy || { docker logs hf; exit 1; }
      - name: Draft a log through the API (offline parser, no Groq)
        run: |
          docker exec hf python -c "
          import json, urllib.request
          req = urllib.request.Request('http://127.0.0.1:8000/internal/draft', method='POST',
                data=json.dumps({'chat_id': 1, 'text': 'ran 3 miles'}).encode(),
                headers={'content-type': 'application/json'})
          body = json.load(urllib.request.urlopen(req, timeout=60))
          assert body['preview'] == '3 miles of Running today', body
          print(body['preview'])"
      - name: Clean shutdown
        run: |
          docker stop -t 40 hf
          test "$(docker inspect -f '{{.State.ExitCode}}' hf)" = 0
          docker logs hf 2>&1 | grep -q "database system is shut down"
      - name: Render free web-service mode (PORT set, 0.1 CPU)
        run: |
          docker run -d --name hfweb --cpus 0.1 --memory 512m -p 127.0.0.1:10000:10000 \
            -e PORT=10000 -e RENDER_EXTERNAL_URL=http://127.0.0.1:10000 -e KEEP_AWAKE_MINUTES=0.2 \
            --env-file ci.env habitflow-all
          for i in $(seq 90); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/healthz)" = 200 ] && break; sleep 2
          done
          curl -sf http://127.0.0.1:10000/ | grep -q "HabitFlow is running"
          curl -sf http://127.0.0.1:10000/healthz | python3 -c 'import sys,json; assert json.load(sys.stdin)["status"] == "ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:10000/internal/habits)" = 404
          sleep 20
          curl -s http://127.0.0.1:10000/healthz | python3 -c 'import sys,json; assert json.load(sys.stdin)["keep_awake"]["pings_ok"] >= 1'
          docker stop -t 30 hfweb
