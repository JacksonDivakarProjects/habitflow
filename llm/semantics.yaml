# ============================================================
# HabitFlow — semantic model for the LLM
# The LLM reads this to understand the schema and produce SQL.
# ============================================================

tables:
  - name: habits
    description: "Habit definitions. One row per habit."
    columns:
      - name: habit_id
        type: SERIAL
        primary_key: true
      - name: name
        type: VARCHAR(100)
        description: "internal identifier, lowercase, snake_case (e.g. 'learning_sql')"
      - name: display_name
        type: TEXT
        description: "human-readable name (e.g. 'Learning SQL')"
      - name: metric
        type: VARCHAR(50)
        nullable: true
        description: "default unit; NULL if none is natural"
      - name: is_active
        type: BOOLEAN
        description: "only active habits are loggable"

  - name: daily_logs
    description: "One row per logged event. Append-only."
    columns:
      - name: log_id
        type: BIGSERIAL
        primary_key: true
      - name: habit_id
        type: INTEGER
        foreign_key: habits.habit_id
      - name: amount
        type: NUMERIC(10,2)
        description: "must be > 0"
      - name: metric
        type: VARCHAR(50)
        description: "unit for THIS log, not the habit's default"
      - name: logged_at
        type: TIMESTAMPTZ
        description: "exact moment; defaults to NOW()"
      - name: log_date
        type: DATE
        description: "YYYY-MM-DD in user's timezone (Asia/Kolkata)"
      - name: source
        type: VARCHAR(20)
        description: "'manual' | 'llm' | 'import' | 'api'"
      - name: audit_id
        type: BIGINT
        foreign_key: audit_log.audit_id

  - name: audit_log
    description: "LLM session trace."
    columns:
      - name: audit_id
        type: BIGSERIAL
        primary_key: true
      - name: chat_id
        type: BIGINT
      - name: user_input
        type: TEXT
      - name: intent
        type: JSONB
      - name: status
        type: VARCHAR(20)
        description: "'pending' | 'awaiting_input' | 'approved' | 'executed' | 'failed' | 'cancelled' | 'superseded'"

# ------------------------------------------------------------
# Intent contract
# ------------------------------------------------------------
intent_shape:
  habit_name: "string matching a known habit, or null"
  proposed_habit: "short lowercase snake_case name for a new habit, or null"
  amount: "positive number, or null"
  metric: "the unit the user said, normalized to a preferred name (see UNITS), or null if they gave none"
  suggested_metric: "when metric is null: the unit you recommend (see UNITS); otherwise null"
  log_date: "YYYY-MM-DD"
  confidence: "0.0 to 1.0"
  draft_sql: "a valid Postgres INSERT into daily_logs using :named placeholders for amount/metric/log_date"
  extra_logs: "list of the OTHER logs in the same message, each {habit_name, amount, metric, suggested_metric, log_date}; [] when the message has one log"

# ------------------------------------------------------------
# Rules
# ------------------------------------------------------------
rules:
  - "amount must be a positive number"
  - "log_date must be YYYY-MM-DD, never in the future"
  - "metric and suggested_metric follow the UNITS section below"
  - "if no known habit matches, propose a short lowercase snake_case name in proposed_habit"
  - "habit_name must match a name from KNOWN HABITS or be null"
  - "draft_sql: INSERT INTO daily_logs with a subquery to look up habit_id by name"
  - "draft_sql: use :amount, :metric, :log_date as named placeholders"
  - "several habits in one message (\"ran 3 miles and read 20 pages\"): the first goes in the main fields, the rest in extra_logs, and draft_sql inserts one row per log with :amount_2, :metric_2, :log_date_2 and so on"
  - "a follow-up message corrects your previous JSON: keep every field the user did not change"
  - "never use DROP, DELETE, UPDATE, or TRUNCATE"
  - "return ONLY the JSON object, no markdown"

# ------------------------------------------------------------
# SQL style — examples the LLM should follow
# ------------------------------------------------------------
sql_examples:
  - intent: "log 4 miles of running today"
    draft_sql: |
      INSERT INTO daily_logs (habit_id, amount, metric, log_date, source)
      VALUES (
        (SELECT habit_id FROM habits WHERE name = 'running'),
        :amount, :metric, :log_date, 'llm'
      )

  - intent: "log 20 pages of reading"
    draft_sql: |
      INSERT INTO daily_logs (habit_id, amount, metric, log_date, source)
      VALUES (
        (SELECT habit_id FROM habits WHERE name = 'reading'),
        :amount, :metric, :log_date, 'llm'
      )

  - intent: "log 3 miles of running and 20 pages of reading"
    draft_sql: |
      INSERT INTO daily_logs (habit_id, amount, metric, log_date, source)
      VALUES
        ((SELECT habit_id FROM habits WHERE name = 'running'), :amount, :metric, :log_date, 'llm'),
        ((SELECT habit_id FROM habits WHERE name = 'reading'), :amount_2, :metric_2, :log_date_2, 'llm')

# ------------------------------------------------------------
# Units: the LLM normalizes and suggests; the API re-checks.
# ------------------------------------------------------------
units:
  preferred: [miles, km, meters, minutes, hours, seconds, pages, chapters, books,
              reps, sets, steps, laps, glasses, liters, ml, calories, concepts]
  rules:
    - "metric is the unit the user SAID, written with a preferred name: mi/mile -> miles, k/kms/kilometres -> km, min/mins -> minutes, hr/hrs/h -> hours, pg/pgs -> pages"
    - "a unit the user said that has no preferred name (e.g. \"burpees\") is kept as they wrote it, lowercase and plural"
    - "read ambiguous abbreviations from the habit's default_metric: \"m\" is meters for a distance habit (miles, km) and minutes for a time habit (minutes, hours)"
    - "never convert: keep the user's number with the user's unit (\"5 km\" stays 5 km even if the default is miles)"
    - "when the user gave NO unit, metric is null and suggested_metric is the habit's default_metric, else its recently_used unit, else the most natural unit for the activity"
    - "for a proposed_habit, always fill suggested_metric (or metric) with the most natural unit, since it becomes the new habit's default: pushups -> reps, water -> glasses, swimming -> laps, studying -> hours"
  examples:
    - {text: "ran 500 m", habit_default: miles, metric: meters, suggested_metric: null}
    - {text: "meditated 30m", habit_default: minutes, metric: minutes, suggested_metric: null}
    - {text: "ran 5k", habit_default: miles, metric: km, suggested_metric: null}
    - {text: "read 20", habit_default: pages, metric: null, suggested_metric: pages}
    - {text: "did 20 pushups", habit_default: "(new habit)", metric: null, suggested_metric: reps}
    - {text: "drank 8 glasses of water", habit_default: "(new habit)", metric: glasses, suggested_metric: null}

# ============================================================
# Questions about the logs ("how much did I read this month?")
# ============================================================

# ------------------------------------------------------------
# Classifier: only messages the API's rules couldn't place get here.
# ------------------------------------------------------------
classifier:
  kinds:
    log: "the user reports something they did, to be recorded (usually has an amount)"
    query: "the user asks about their own past activity: totals, patterns, streaks, comparisons"
    chat: "greetings, thanks, help, or anything unrelated to logging or their data"
  examples:
    - {text: "read today", kind: query}
    - {text: "running this morning, four miles", kind: log}
    - {text: "sql last week", kind: query}
    - {text: "meditated before bed", kind: log}
    - {text: "reading lately", kind: query}
    - {text: "pushups twenty", kind: log}
    - {text: "tell me a joke", kind: chat}
    - {text: "is it going well", kind: query}

# ------------------------------------------------------------
# Text-to-SQL: one read-only SELECT over these relations only.
# The API rejects anything else and sends the reason back.
# ------------------------------------------------------------
query:
  relations:
    - name: habit_logs
      description: "One row per logged activity. Undone logs are already excluded."
      columns:
        - {name: log_id, type: BIGINT}
        - {name: habit, type: TEXT, description: "habit's internal name, e.g. 'reading' (match against KNOWN HABITS names)"}
        - {name: habit_display, type: TEXT, description: "e.g. 'Reading'"}
        - {name: amount, type: NUMERIC, description: "the number as logged, in `unit`"}
        - {name: unit, type: TEXT, description: "unit as logged, e.g. 'km', 'minutes', 'pages'"}
        - {name: habit_unit, type: TEXT, description: "the habit's default unit, NULL if it has none"}
        - {name: amount_in_habit_unit, type: NUMERIC, description: "amount converted to habit_unit (5 km -> 3.1069 for a miles habit); NULL when the units can't convert (e.g. minutes of reading for a pages habit)"}
        - {name: log_date, type: DATE, description: "the day it was done"}
        - {name: logged_at, type: TIMESTAMPTZ, description: "when it was recorded"}
        - {name: weekday, type: INTEGER, description: "1 = Monday .. 7 = Sunday"}
        - {name: weekday_name, type: TEXT, description: "'Monday' .. 'Sunday'"}
        - {name: week_start, type: DATE, description: "Monday of that week"}
        - {name: month_start, type: DATE, description: "first day of that month"}
    - name: habits
      description: "Habit definitions (to list habits, or find ones with no logs)."
      columns:
        - {name: name, type: TEXT}
        - {name: display_name, type: TEXT}
        - {name: metric, type: TEXT, description: "default unit"}
        - {name: is_active, type: BOOLEAN}
  rules:
    - "return exactly ONE PostgreSQL SELECT (CTEs, window functions, UNION allowed); never write INSERT/UPDATE/DELETE/DDL"
    - "read only habit_logs and habits; no other tables, schemas or system catalogs"
    - "never use CURRENT_DATE, NOW(), CURRENT_TIMESTAMP: use the literal dates from DATES, e.g. log_date >= DATE '2026-09-01'"
    - "if QUESTION_PERIOD is given, filter log_date to exactly that range; with no period, use all time"
    - "filter habits by the exact `habit` name from KNOWN HABITS (\"worked\" -> 'work', \"ran\" -> 'running'); if no habit is named, cover all habits and group by habit"
    - "sum amounts with coalesce(amount_in_habit_unit, amount) and group by CASE WHEN amount_in_habit_unit IS NULL THEN unit ELSE habit_unit END, so different units are never added together"
    - "when the user asks in another unit (\"how many hours\" for a minutes habit) convert in SQL: minutes/60 = hours, km*0.621371 = miles"
    - "'pattern', 'trend', 'habit over time' questions: group by weekday (ORDER BY weekday) or by week_start/month_start, with totals and counts of days"
    - "streaks and gaps: use DISTINCT log_date with window functions (log_date - row_number() days trick)"
    - "days with no logs: generate_series(DATE 'start', DATE 'end', INTERVAL '1 day') LEFT JOIN habit_logs"
    - "give every computed column a short snake_case alias (total_pages, days_logged); round decimals to 2 places"
    - "keep results small and readable: aggregate instead of listing raw rows when you can; ORDER BY something meaningful"
    - "if the question can't be answered from these relations (weather, advice, other people), return sql: null and a short friendly note saying what you CAN answer"
  examples:
    - question: "how much did I read this month"
      sql: |
        SELECT CASE WHEN amount_in_habit_unit IS NULL THEN unit ELSE habit_unit END AS unit,
               round(sum(coalesce(amount_in_habit_unit, amount)), 2) AS total,
               count(DISTINCT log_date) AS days
        FROM habit_logs
        WHERE habit = 'reading' AND log_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-24'
        GROUP BY 1
    - question: "what is my reading pattern"
      sql: |
        SELECT weekday_name, count(DISTINCT log_date) AS days_read,
               round(sum(coalesce(amount_in_habit_unit, amount)), 2) AS total,
               round(avg(coalesce(amount_in_habit_unit, amount)), 2) AS avg_per_log
        FROM habit_logs
        WHERE habit = 'reading'
        GROUP BY weekday, weekday_name
        ORDER BY weekday
    - question: "how many hours did I work each week this month"
      sql: |
        SELECT week_start, round(sum(coalesce(amount_in_habit_unit, amount)), 2) AS hours
        FROM habit_logs
        WHERE habit = 'work' AND log_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-24'
        GROUP BY week_start
        ORDER BY week_start
    - question: "which habit did I do most often last week"
      sql: |
        SELECT habit_display, count(DISTINCT log_date) AS days
        FROM habit_logs
        WHERE log_date BETWEEN DATE '2026-09-14' AND DATE '2026-09-20'
        GROUP BY habit_display
        ORDER BY days DESC
    - question: "my longest running streak"
      sql: |
        WITH d AS (SELECT DISTINCT log_date FROM habit_logs WHERE habit = 'running'),
             g AS (SELECT log_date, log_date - (row_number() OVER (ORDER BY log_date))::int AS grp FROM d)
        SELECT min(log_date) AS started, max(log_date) AS ended, count(*) AS days
        FROM g GROUP BY grp ORDER BY days DESC, ended DESC LIMIT 1
    - question: "which days this week did I skip meditation"
      sql: |
        SELECT d::date AS day, trim(to_char(d, 'Day')) AS weekday
        FROM generate_series(DATE '2026-09-21', DATE '2026-09-24', INTERVAL '1 day') AS d
        WHERE NOT EXISTS (SELECT 1 FROM habit_logs l WHERE l.habit = 'meditation' AND l.log_date = d::date)
        ORDER BY day

# ------------------------------------------------------------
# Answer: turn the rows into a reply.
# ------------------------------------------------------------
answer:
  rules:
    - "answer the question directly in 1-3 short sentences, using ONLY the numbers in ROWS; never invent or estimate"
    - "say amounts with their units (\"320 pages\", \"12.5 hours\") and name the period (\"this month\", \"last week\")"
    - "for patterns, point out the highlight (best day, trend up or down, consistency) in plain words"
    - "if ROWS is empty, say nothing was logged for that and suggest logging, e.g. \"No reading logged this month yet.\""
    - "if TRUNCATED is true, say these are the first rows only"
    - "friendly and encouraging, no markdown tables (the app shows the table), at most one emoji"
