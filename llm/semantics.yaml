# ============================================================
# HabitFlow — semantic model for the LLM
# The LLM reads this to understand the schema and produce SQL.
# ============================================================

tables:
  - name: habits
    description: "Habit definitions. One row per habit."
    columns:
      - name: habit_id
        type: SERIAL
        primary_key: true
      - name: name
        type: VARCHAR(100)
        description: "internal identifier, lowercase, snake_case (e.g. 'learning_sql')"
      - name: display_name
        type: TEXT
        description: "human-readable name (e.g. 'Learning SQL')"
      - name: metric
        type: VARCHAR(50)
        nullable: true
        description: "default unit; NULL if none is natural"
      - name: is_active
        type: BOOLEAN
        description: "only active habits are loggable"

  - name: daily_logs
    description: "One row per logged event. Append-only."
    columns:
      - name: log_id
        type: BIGSERIAL
        primary_key: true
      - name: habit_id
        type: INTEGER
        foreign_key: habits.habit_id
      - name: amount
        type: NUMERIC(10,2)
        description: "must be > 0"
      - name: metric
        type: VARCHAR(50)
        description: "unit for THIS log, not the habit's default"
      - name: logged_at
        type: TIMESTAMPTZ
        description: "exact moment; defaults to NOW()"
      - name: log_date
        type: DATE
        description: "YYYY-MM-DD in user's timezone (Asia/Kolkata)"
      - name: source
        type: VARCHAR(20)
        description: "'manual' | 'llm' | 'import' | 'api'"
      - name: audit_id
        type: BIGINT
        foreign_key: audit_log.audit_id

  - name: audit_log
    description: "LLM session trace."
    columns:
      - name: audit_id
        type: BIGSERIAL
        primary_key: true
      - name: chat_id
        type: BIGINT
      - name: user_input
        type: TEXT
      - name: intent
        type: JSONB
      - name: status
        type: VARCHAR(20)
        description: "'pending' | 'awaiting_input' | 'approved' | 'executed' | 'failed' | 'cancelled' | 'superseded'"

# ------------------------------------------------------------
# Intent contract
# ------------------------------------------------------------
intent_shape:
  habit_name: "string matching a known habit, or null"
  proposed_habit: "short lowercase snake_case name for a new habit, or null"
  amount: "positive number, or null"
  metric: "the unit the user said, normalized to a preferred name (see UNITS), or null if they gave none"
  suggested_metric: "when metric is null: the unit you recommend (see UNITS); otherwise null"
  log_date: "YYYY-MM-DD"
  confidence: "0.0 to 1.0"
  draft_sql: "a valid Postgres INSERT into daily_logs using :named placeholders for amount/metric/log_date"
  extra_logs: "list of the OTHER logs in the same message, each {habit_name, amount, metric, suggested_metric, log_date}; [] when the message has one log"

# ------------------------------------------------------------
# Rules
# ------------------------------------------------------------
rules:
  - "amount must be a positive number"
  - "log_date must be YYYY-MM-DD, never in the future"
  - "metric and suggested_metric follow the UNITS section below"
  - "if no known habit matches, propose a short lowercase snake_case name in proposed_habit"
  - "habit_name must match a name from KNOWN HABITS or be null"
  - "draft_sql: INSERT INTO daily_logs with a subquery to look up habit_id by name"
  - "draft_sql: use :amount, :metric, :log_date as named placeholders"
  - "several habits in one message (\"ran 3 miles and read 20 pages\"): the first goes in the main fields, the rest in extra_logs, and draft_sql inserts one row per log with :amount_2, :metric_2, :log_date_2 and so on"
  - "a follow-up message corrects your previous JSON: keep every field the user did not change"
  - "never use DROP, DELETE, UPDATE, or TRUNCATE"
  - "return ONLY the JSON object, no markdown"

# ------------------------------------------------------------
# SQL style — examples the LLM should follow
# ------------------------------------------------------------
sql_examples:
  - intent: "log 4 miles of running today"
    draft_sql: |
      INSERT INTO daily_logs (habit_id, amount, metric, log_date, source)
      VALUES (
        (SELECT habit_id FROM habits WHERE name = 'running'),
        :amount, :metric, :log_date, 'llm'
      )

  - intent: "log 20 pages of reading"
    draft_sql: |
      INSERT INTO daily_logs (habit_id, amount, metric, log_date, source)
      VALUES (
        (SELECT habit_id FROM habits WHERE name = 'reading'),
        :amount, :metric, :log_date, 'llm'
      )

  - intent: "log 3 miles of running and 20 pages of reading"
    draft_sql: |
      INSERT INTO daily_logs (habit_id, amount, metric, log_date, source)
      VALUES
        ((SELECT habit_id FROM habits WHERE name = 'running'), :amount, :metric, :log_date, 'llm'),
        ((SELECT habit_id FROM habits WHERE name = 'reading'), :amount_2, :metric_2, :log_date_2, 'llm')

# ------------------------------------------------------------
# Units: the LLM normalizes and suggests; the API re-checks.
# ------------------------------------------------------------
units:
  preferred: [miles, km, meters, minutes, hours, seconds, pages, chapters, books,
              reps, sets, steps, laps, glasses, liters, ml, calories, concepts]
  rules:
    - "metric is the unit the user SAID, written with a preferred name: mi/mile -> miles, k/kms/kilometres -> km, min/mins -> minutes, hr/hrs/h -> hours, pg/pgs -> pages"
    - "a unit the user said that has no preferred name (e.g. \"burpees\") is kept as they wrote it, lowercase and plural"
    - "read ambiguous abbreviations from the habit's default_metric: \"m\" is meters for a distance habit (miles, km) and minutes for a time habit (minutes, hours)"
    - "never convert: keep the user's number with the user's unit (\"5 km\" stays 5 km even if the default is miles)"
    - "when the user gave NO unit, metric is null and suggested_metric is the habit's default_metric, else its recently_used unit, else the most natural unit for the activity"
    - "for a proposed_habit, always fill suggested_metric (or metric) with the most natural unit, since it becomes the new habit's default: pushups -> reps, water -> glasses, swimming -> laps, studying -> hours"
  examples:
    - {text: "ran 500 m", habit_default: miles, metric: meters, suggested_metric: null}
    - {text: "meditated 30m", habit_default: minutes, metric: minutes, suggested_metric: null}
    - {text: "ran 5k", habit_default: miles, metric: km, suggested_metric: null}
    - {text: "read 20", habit_default: pages, metric: null, suggested_metric: pages}
    - {text: "did 20 pushups", habit_default: "(new habit)", metric: null, suggested_metric: reps}
    - {text: "drank 8 glasses of water", habit_default: "(new habit)", metric: glasses, suggested_metric: null}
