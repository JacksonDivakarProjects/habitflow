# Render Blueprint: HabitFlow as ONE Background Worker, data in Neon Postgres.
# Dashboard -> New -> Blueprint -> pick this repo. Render asks for the four
# secrets marked `sync: false`.
#
# DATABASE_URL: your Neon connection string (Neon console -> Connect), e.g.
#   postgresql://neondb_owner:<password>@ep-xxxx.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
# Keep the worker in the Neon database's region: us-east-2 (Ohio) -> region: ohio.
# Use the direct connection string, not the "-pooler" one; the API opens one
# connection per request for Neon, so it can scale to zero between uses.
#
# With DATABASE_URL set, the image doesn't start its built-in Postgres, so the
# worker stores nothing itself: no disk needed, and redeploys lose nothing.
#
# Prefer the built-in database on a Render disk instead? Remove DATABASE_URL
# and add under the service:
#     disk:
#       name: habitflow-data
#       mountPath: /data
#       sizeGB: 1

services:
  - type: worker
    name: habitflow
    runtime: image
    image:
      url: docker.io/jackdiva/habitflow:all-1.1.0
    plan: 0.5c-512mb          # Starter; the app uses ~150 MB without its database
    region: ohio              # same place as the Neon database (aws us-east-2)
    envVars:
      - key: DATABASE_URL     # Neon connection string: entered in the Render dashboard,
        sync: false           # never written here (this file is public on GitHub)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: APP_TIMEZONE
        value: Asia/Kolkata
