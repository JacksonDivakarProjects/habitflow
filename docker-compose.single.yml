# HabitFlow as ONE container: Postgres + llm + api + bot (jackdiva/habitflow:all-<tag>).
# A separate system from docker-compose.yml: its own project name, settings
# file (.env.single) and volume, so both can run on the same machine.
#
#   cp .env.single.example .env.single    # fill it in
#   docker compose --env-file .env.single -f docker-compose.single.yml up -d          # pull the image
#   docker compose --env-file .env.single -f docker-compose.single.yml up -d --build  # or build it
#
# With DATABASE_URL set (e.g. Neon) the built-in database isn't used; without
# it, the data lives in the habitflow-single_data volume.
#
# Same thing without compose:
#   docker run -d --name habitflow-single --restart unless-stopped \
#     -v habitflow-single_data:/data --env-file .env.single jackdiva/habitflow:all-<tag>

name: habitflow-single

services:
  habitflow:
    image: ${HABITFLOW_IMAGE:-jackdiva/habitflow}:all-${HABITFLOW_TAG:-latest}
    build:
      context: .
      dockerfile: allinone/Dockerfile
    restart: unless-stopped
    env_file: .env.single     # copy .env.single.example; separate from the compose .env
    volumes:
      - data:/data            # the built-in database (unused when DATABASE_URL is set)
    stop_grace_period: 40s    # let Postgres shut down cleanly
    # Nothing is published: the API and database listen inside the container only.

volumes:
  data:
